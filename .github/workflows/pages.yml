# Publishes the web/ folder to GitHub Pages on every push to main.
# The site is plain static files with relative paths, so there is no build step.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every page asset exists
        run: |
          missing=0
          for f in $(grep -ohE '(src|href|poster)="[^"#:]+"' web/index.html | sed -E 's/^[a-z]+="//; s/"$//'); do
            [ -e "web/$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
